name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Tests that need the optional model or OCR files skip themselves here; the e2e job runs them.
      - run: pnpm test
      - run: pnpm build
      - name: Changelog updated when code changes (PRs)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          code=$(echo "$files" | grep -Ev '^(docs/|CLAUDE\.md$|\.githooks/|\.github/|.*\.md$)' || true)
          if [ -n "$code" ] && ! echo "$files" | grep -q '^docs/CHANGELOG\.md$'; then
            echo "Code changed but docs/CHANGELOG.md was not updated."; exit 1
          fi

  e2e:
    # Real Chromium: the web app, the file and OCR flows, and the extension on mock chat pages.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the name model
        uses: actions/cache@v4
        with:
          path: packages/ner/models
          key: ner-model-${{ hashFiles('packages/ner/scripts/fetch-model.mjs') }}
      - name: Fetch the name model (build-time download; the product makes no network calls)
        run: pnpm --filter @maskit/ner fetch-model
      - name: Install the test browser
        run: pnpm --filter @maskit/e2e exec playwright install --with-deps chromium
      - name: Tests that need the model (benchmark with names)
        run: pnpm --filter @maskit/bench test
      - name: End-to-end tests
        run: pnpm --filter @maskit/e2e e2e
      - name: Keep the Playwright report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/e2e/test-results
